<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Warm orange background circle -->
  <circle cx="32" cy="32" r="32" fill="#ea580c"/>
  <!-- Frying pan body -->
  <ellipse cx="34" cy="38" rx="16" ry="11" fill="#1c1917"/>
  <!-- Pan handle -->
  <rect x="6" y="35" width="18" height="5" rx="2.5" fill="#1c1917"/>
  <!-- Pan rim highlight -->
  <ellipse cx="34" cy="38" rx="16" ry="11" fill="none" stroke="#fff7ed" stroke-width="1.5" opacity="0.25"/>
  <!-- Egg white -->
  <ellipse cx="34" cy="37" rx="9" ry="7" fill="#fef9f0"/>
  <!-- Egg yolk -->
  <circle cx="34" cy="36" r="4" fill="#fbbf24"/>
  <!-- Yolk shine -->
  <circle cx="32.5" cy="34.5" r="1.2" fill="#fef9f0" opacity="0.7"/>
</svg>
