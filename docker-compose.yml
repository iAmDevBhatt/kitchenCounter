version: '3.8'

# ── How to use ────────────────────────────────────────────────────────────────
#  Standalone (SQLite, default) — one image, frontend + backend in one container:
#    cd /opt/blr-stack/KitchenCounter
#    docker compose up --build -d
#
#  Merged into /opt/blr-stack/docker-compose.yml:
#    Copy the `kitchencounter` service (and its named volumes, or point them at
#    bind-mount paths as in your outer compose file) into the parent file.
#    Make sure the shared network (blr-net) is declared in that file too.
#
#  PostgreSQL (optional):
#    docker compose --profile postgres up --build -d
#    then set DATABASE_URL below to point at kitchencounter-db.
# ─────────────────────────────────────────────────────────────────────────────

networks:
  blr-net:
    driver: bridge

services:

  # ── Optional PostgreSQL (activate with --profile postgres) ────────────────
  kitchencounter-db:
    profiles: [postgres]
    image: postgres:15-alpine
    container_name: kitchencounter-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       kitchendb
      POSTGRES_USER:     kitchenuser
      POSTGRES_PASSWORD: kitchenpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - blr-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitchenuser -d kitchendb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── KitchenCounter — single image: FastAPI backend + built React frontend ──
  kitchencounter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kitchencounter
    restart: unless-stopped
    environment:
      # SQLite (default — no extra services needed)
      DATABASE_URL: sqlite:////data/db/kitchendb.sqlite
      # Uncomment for PostgreSQL (use --profile postgres):
      # DATABASE_URL: postgresql+psycopg2://kitchenuser:kitchenpass@kitchencounter-db:5432/kitchendb
      # IMPORTANT: change this before deploying to production
      SECRET_KEY: change-me-in-production-use-a-long-random-string
      ACCESS_TOKEN_EXPIRE_MINUTES: "480"
      SERVE_STATIC: "true"
      PORT: "8000"
      # Set both to a real host uid/gid to fix ownership on the bind-mounted
      # volumes below; leave at 0/0 (or unset) to run as root.
      PUID: "0"
      PGID: "0"
    volumes:
      - uploads_data:/app/backend/static/uploads   # item images — survives rebuilds
      - db_data:/data/db                   # SQLite DB — survives rebuilds
    networks:
      - blr-net
    ports:
      - "8007:8000"    # Access at http://localhost:8007

volumes:
  postgres_data:
  uploads_data:    # persistent uploaded images
  db_data:         # persistent SQLite database file
